services:
  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
  water-bbs-api:
    build:
      context: .
      target: test
    ports:
      - 3000:3000
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/dist/config